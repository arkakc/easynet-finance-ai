name: Phase 9 Security and Audit Validation

on:
  push:
    branches:
      - fix/phase-9-security-audit-controls
  pull_request:
    branches:
      - fix/phase-8-reporting-reconciliation-hardening
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SESSION_SECRET: phase9-ci-session-secret-32-characters-minimum
      AUDIT_LOG_SECRET: phase9-ci-audit-secret-32-characters-minimum
      DATABASE_URL: file:./prisma/dev.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Create isolated validation database
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Phase 7 multi-currency regression
        run: npm run test:multi-currency

      - name: Phase 8 reporting reconciliation regression
        run: npm run test:reporting-reconciliation

      - name: Manual journal maker-checker regression
        run: npm run test:manual-journal-approval

      - name: Period close regression
        run: npm run test:period-close

      - name: Chart of Accounts import regression
        run: npm run test:coa-import

      - name: Transaction reset regression
        run: npm run test:transaction-reset

      - name: Master-data reset regression
        run: npm run test:master-reset

      - name: Phase 9 security and audit UAT
        run: npm run test:security-audit

      - name: Production build
        run: npm run build
