name: Phase 10 Full UAT

on:
  push:
    branches:
      - fix/phase-10-full-uat
  pull_request:
    branches:
      - fix/phase-9-security-audit-controls
  workflow_dispatch:

jobs:
  full-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SESSION_SECRET: phase10-ci-session-secret-32-characters-minimum
      AUDIT_LOG_SECRET: phase10-ci-audit-secret-32-characters-minimum
      AUTH_SECRET: phase10-ci-nextauth-secret-32-characters-minimum
      APP_SECRET: phase10-ci-app-secret-32-characters-minimum
      APP_ENV: local
      GO_LIVE_REQUIRE_POSTGRES: "true"
      PHASE10_ISOLATED_UAT: "1"
      UAT_BASE_URL: http://127.0.0.1:3104
      PORT: "3104"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Create isolated UAT database
        run: npx prisma db push --skip-generate

      - name: Seed isolated UAT company
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start isolated UAT server
        run: |
          npm run start -- -p 3104 > /tmp/easynet-phase10-server.log 2>&1 &
          echo $! > /tmp/easynet-phase10-server.pid

      - name: Wait for UAT server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3104/api/health > /dev/null; then
              echo "UAT server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/easynet-phase10-server.log
          exit 1

      - name: Run Phase 10 full UAT
        run: npm run test:full-uat

      - name: Server log
        if: always()
        run: cat /tmp/easynet-phase10-server.log || true
