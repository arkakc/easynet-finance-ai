name: Deferred Revenue Accounting Checks
on:
  pull_request:
    paths:
      - "app/api/accounting/deferred-revenue/**"
      - "app/api/transactions/route.ts"
      - "app/api/masters/route.ts"
      - "scripts/database/finance-uat-deep-audit.ts"
      - "scripts/database/reclassify-historical-control-accounts.ts"
      - "tests/accounting/settlement-control-account.test.ts"
      - "app/api/stock/route.ts"
      - "tests/accounting/stock-delivery-movement.test.ts"
      - "tests/accounting/gst-posting-eligibility.test.ts"
      - "app/components/master-doctype-detail-client.tsx"
      - "app/components/stock-workspace-v6.tsx"
      - "app/stock/item/**"
      - "app/stock/movement/**"
      - "app/components/stock-movement-clickable-row.tsx"
      - "app/components/linked-document-reference.tsx"
      - "app/components/journal-register-client.tsx"
      - "app/components/transaction-document-client.tsx"
      - "app/components/purchase-receipt-client.tsx"
      - "app/components/transaction-item-lines.tsx"
      - "lib/accounting/sales-order-reservations.ts"
      - "tests/accounting/sales-order-reservations.test.ts"
      - "app/components/transactions-workspace-v5.tsx"
      - "app/components/sales-invoice-cycle.tsx"
      - "app/components/delivery-note-client.tsx"
      - "app/globals.css"
      - "lib/accounting/**"
      - "lib/backend/prisma-store.ts"
      - "prisma/schema.prisma"
      - "tests/accounting/**"
      - "package.json"
      - ".github/workflows/deferred-revenue.yml"
  workflow_dispatch:

jobs:
  accounting-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "file:./ci-deferred-revenue.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:deferred-revenue
      - run: npx tsx --test tests/accounting/gst-posting-eligibility.test.ts
      - run: npx tsx --test tests/accounting/stock-delivery-movement.test.ts
      - run: npx tsx --test tests/accounting/settlement-control-account.test.ts
      - run: npx tsx --test tests/accounting/sales-order-reservations.test.ts
      - run: npm run typecheck
