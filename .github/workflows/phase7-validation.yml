name: Phase 7 Multi-Currency Validation

on:
  push:
    branches:
      - fix/phase-7-multi-currency
  pull_request:
    branches:
      - fix/phase-6-warehouse-stock
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # package-lock.json predates a transitive optional-dependency refresh,
        # so validation installs from package.json without changing the repo.
        run: npm install --no-audit --no-fund

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Create isolated validation database
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Multi-currency UAT
        run: npm run test:multi-currency

      - name: Build
        env:
          SESSION_SECRET: phase7-ci-session-secret-please-change-only-for-ci
          DATABASE_URL: file:./prisma/dev.db
        run: npm run build
